name: Package

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      MACOS_CERT_P12_BASE64: { required: false }
      MACOS_CERT_PASSWORD: { required: false }
      MACOS_KEYCHAIN_PASSWORD: { required: false }
      MACOS_CODESIGN_IDENTITY: { required: false }
      APPLE_ID: { required: false }
      APPLE_APP_SPECIFIC_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }

jobs:
  windows:
    name: Package ${{ matrix.runtime }}
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, win7-x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: kantunext.${{ matrix.runtime }}
          path: build
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          New-Item -ItemType Directory -Force build\KanTuNext | Out-Null
          tar -xf build\kantunext.tar -C build\KanTuNext
          ./build/scripts/package.win.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: package.${{ matrix.runtime }}
          path: build/KanTuNext_*.zip
          # Already compressed; recompressing only slows the upload
          compression-level: 0
          retention-days: 3

  macos:
    name: Package macOS
    # Packaging only thins, signs and archives; nothing runs the x64 binary, so Apple Silicon is fine. Both
    # architectures share one job: a second macOS runner can queue for a quarter of an hour, packaging takes ~30 s
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
      - uses: actions/download-artifact@v7
        with:
          pattern: kantunext.osx-*
          path: publish
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
        run: |
          for RUNTIME in osx-x64 osx-arm64; do
            mkdir -p build/KanTuNext
            tar -xf "publish/kantunext.$RUNTIME/kantunext.tar" -C build/KanTuNext
            RUNTIME=$RUNTIME ./build/scripts/package.osx-app.sh
          done
      - name: Notarize and staple
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          for RUNTIME in osx-x64 osx-arm64; do
            DMG="build/KanTuNext_${{ inputs.version }}.$RUNTIME.dmg"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "$DMG"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: package.macos
          path: |
            build/KanTuNext_*.zip
            build/KanTuNext_*.dmg
          compression-level: 0
          retention-days: 3

  linux:
    name: Package ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    strategy:
      matrix:
        include:
          - { runtime: linux-x64, os: ubuntu-latest }
          # Native arm64 runner so the aarch64 appimagetool runs as is
          - { runtime: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - name: Packaging tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file dpkg-dev rpm libtesseract4 patchelf
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: kantunext.${{ matrix.runtime }}
          path: build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          # No FUSE in containers
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p build/KanTuNext
          tar -xf build/kantunext.tar -C build/KanTuNext
          ./build/scripts/package.linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: package.${{ matrix.runtime }}
          path: |
            build/KanTuNext-*.AppImage
            build/kantunext_*.deb
            build/kantunext-*.rpm
          compression-level: 0
          retention-days: 3
