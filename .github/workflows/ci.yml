name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'legacy/**']
  workflow_dispatch:

# A newer push supersedes a running CI of the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Managed tests don't depend on the CPU architecture: once per OS is enough
  test:
    # A "release: vX" commit is pushed with its tag; the tag's Release run builds the same tree
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:')
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # Pinned: rolling forward to the newest feature band has picked versions not yet downloadable
          dotnet-version: '10.0.402'

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-test-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-test-${{ runner.os }}-
      - name: Test
        shell: bash
        run: dotnet test tests/KanTuNext.Tests/KanTuNext.Tests.csproj -c Release -p:TreatWarningsAsErrors=true

  build:
    needs: test
    name: Build
    uses: ./.github/workflows/build.yml
