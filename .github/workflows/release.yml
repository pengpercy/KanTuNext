name: Release

on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '[:space:]' < VERSION)" || { echo "tag $GITHUB_REF_NAME != VERSION"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  package:
    needs: [version, build]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package.*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "([[:space:]-]|$)" {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          [ -s notes.md ] || echo "看图 $VERSION" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "看图 ${{ needs.version.outputs.version }}" --notes-file notes.md
